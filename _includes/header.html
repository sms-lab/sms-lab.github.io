{% if jekyll.environment == 'production' and site.google_tag_manager and site.google_tag_manager != '' %}
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
{% endif %}

<nav class="navbar navbar-expand-md navbar-dark site-navbar">
    <div class="container-fluid">
        <a class="navbar-brand site-navbar-logos" href="{{ site.url }}{{ site.baseurl }}/" aria-label="{{ site.title | escape }}">
            <img src="{{ '/images/Icons/hkust-gz.svg' | relative_url }}" class="site-navbar-logo site-navbar-logo-hkust" alt="HKUST Guangzhou">
            <img src="{{ '/images/Icons/SMS-LAB.svg' | relative_url }}" class="site-navbar-logo site-navbar-logo-sms" alt="Smart Materials and Systems Lab">
        </a>

        <!-- Toggler button -->
        <button class="toggler navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar links -->
        <div class="collapse navbar-collapse" id="navbarColor02">
            <div class="navbar-nav mr-auto">
                <a class="nav-item nav-link" href="{{ site.url }}{{ site.baseurl }}/">Home</a>
                {% for page in site.nav_pages %}       
                    <a class="nav-item nav-link" href="{{ site.url }}{{ site.baseurl }}/{{page.name}}">{{page.name | capitalize }}</a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
