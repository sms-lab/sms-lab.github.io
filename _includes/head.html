<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
{% if page.layout == 'homelay' %}
  <link rel="preload" as="image" href="{{ '/images/vibration.webp' | relative_url }}" type="image/webp" media="(min-width: 768px)" fetchpriority="high">
  <link rel="preload" as="image" href="{{ '/images/vibration-small.webp' | relative_url }}" type="image/webp" media="(max-width: 767px)" fetchpriority="high">
{% endif %}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="shortcut icon" type ="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/favicon.ico">
  <link rel="stylesheet" href="{{ '/assets/vendor/font-awesome/css/font-awesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/vendor/academicons/css/academicons.min.css' | relative_url }}">



{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

{% if page.mathjax %}
{% include mathjax.html %}
{% endif %}

</head>
